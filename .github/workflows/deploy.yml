name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build OpenNext Cloudflare Worker
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SITE_URL: https://daoheal.pages.dev

      - name: Prepare Pages Functions deployment
        run: |
          ls -la .open-next/
          mkdir -p .pages-deploy
          cp -r .open-next/assets/* .pages-deploy/
          cp .open-next/worker.js .pages-deploy/_worker.js
          ls -la .pages-deploy/

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .pages-deploy --project-name=daoheal --branch=master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
