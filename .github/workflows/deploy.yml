name: Build OpenNext Assets

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build with OpenNext
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SITE_URL: https://daoheal.pages.dev

      - name: Fix root index.html
        run: cp .next/server/app/index.html .open-next/assets/index.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennext-assets
          path: .open-next/assets