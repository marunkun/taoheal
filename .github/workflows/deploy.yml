name: Deploy to Cloudflare

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build with OpenNext
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SITE_URL: https://daoheal.pages.dev

      - name: Deploy to Cloudflare Pages (daoheal.pages.dev)
        run: |
          cp -r .open-next .pages-deploy
          mv .pages-deploy/worker.js .pages-deploy/_worker.js
          cat > .pages-deploy/wrangler.jsonc << 'EOF'
          {
            "compatibility_flags": ["nodejs_compat"],
            "compatibility_date": "2026-06-16"
          }
          EOF
          npx wrangler pages deploy .pages-deploy --project-name daoheal --branch master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
