name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Clean cache before deploy
        run: rm -rf .next/cache

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: daoheal
          directory: .next
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote deployment to production
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deploymentId }}
        run: |
          echo "Deployment ID: $DEPLOYMENT_ID"
          if [ -n "$DEPLOYMENT_ID" ]; then
            curl -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/daoheal/deployments/$DEPLOYMENT_ID/promote" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --fail-with-body
          else
            echo "No deploymentId, trying to find latest deployment..."
            LATEST=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/daoheal/deployments?per_page=1" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result'][0]['id'])")
            echo "Latest deployment: $LATEST"
            curl -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/daoheal/deployments/$LATEST/promote" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --fail-with-body
          fi
